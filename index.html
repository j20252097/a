<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ミュージックプレイヤー 🎧</title>
<style>
  body {
    font-family: "Hiragino Sans", "Noto Sans JP", sans-serif;
    margin: 0;
    padding: 0;
    background: linear-gradient(135deg, #fcecff, #eafff8, #e0e8ff);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* 背景アニメーション */
  @keyframes float {
    0% { transform: translateY(0) rotate(0deg); opacity: 0.7; }
    50% { transform: translateY(-20px) rotate(10deg); opacity: 1; }
    100% { transform: translateY(0) rotate(-10deg); opacity: 0.7; }
  }

  .bubble {
    position: absolute;
    background: rgba(255, 255, 255, 0.6);
    border-radius: 50%;
    animation: float 6s ease-in-out infinite;
    z-index: 0;
  }

  h1 {
    text-align: center;
    font-size: 2em;
    color: #6a5acd;
    padding-top: 30px;
  }

  #player {
    background: rgba(255,255,255,0.85);
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    max-width: 700px;
    margin: 20px auto;
    padding: 20px;
    text-align: center;
    position: relative;
    z-index: 1;
  }

  video {
    width: 100%;
    border-radius: 12px;
    background: #000;
  }

  #info {
    font-size: 1.2em;
    margin-top: 10px;
    color: #444;
  }

  #controls {
    margin-top: 15px;
    display: flex;
    justify-content: center;
    gap: 10px;
  }

  button {
    background: #a58ff7;
    color: white;
    border: none;
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 1em;
    cursor: pointer;
    transition: 0.2s;
  }
  button:hover {
    background: #8c73e6;
  }

  select, input[type="text"] {
    margin-top: 15px;
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-size: 1em;
    width: 90%;
    max-width: 400px;
  }

  #trackList {
    margin-top: 20px;
    max-height: 250px;
    overflow-y: auto;
    text-align: left;
  }

  .track {
    background: white;
    border-radius: 10px;
    padding: 10px;
    margin: 6px 0;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    cursor: pointer;
    transition: background 0.2s;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .track:hover {
    background: #f3f0ff;
  }

  .favorite {
    color: #ccc;
    cursor: pointer;
    font-size: 1.2em;
  }

  .favorite.active {
    color: #ff6781;
  }

  footer {
    text-align: center;
    margin: 30px 0;
    color: #666;
  }

</style>
</head>
<body>

  <!-- 背景にふわふわする泡 -->
  <div class="bubble" style="width:80px;height:80px;top:10%;left:10%;animation-duration:8s;"></div>
  <div class="bubble" style="width:120px;height:120px;top:30%;left:80%;animation-duration:10s;"></div>
  <div class="bubble" style="width:60px;height:60px;top:70%;left:30%;animation-duration:7s;"></div>

  <h1>🌷 ミュージックプレイヤー 🌷</h1>

  <div id="player">
    <video id="videoPlayer" controls></video>
    <div id="info"></div>

    <div id="controls">
      <button id="prevBtn">⏮ 前へ</button>
      <button id="playBtn">▶️ / ⏸</button>
      <button id="nextBtn">⏭ 次へ</button>
    </div>

    <input type="text" id="searchBox" placeholder="🔍 曲名やアーティストで検索..." />

    <select id="artistFilter">
      <option value="">すべてのアーティスト</option>
    </select>

    <div id="trackList"></div>
  </div>

  <footer>© 2025 MusicProject 🎶</footer>

  <script>
    let tracks = [];
    let filteredTracks = [];
    let current = 0;
    let favorites = JSON.parse(localStorage.getItem("favorites") || "[]");

    const player = document.getElementById("videoPlayer");
    const info = document.getElementById("info");
    const list = document.getElementById("trackList");
    const filter = document.getElementById("artistFilter");
    const search = document.getElementById("searchBox");

    async function init() {
      const res = await fetch("tracks.json");
      tracks = await res.json();
      populateArtistFilter();
      renderList(tracks);
      loadTrack(0);
    }

    function populateArtistFilter() {
      const artists = [...new Set(tracks.map(t => t.artist))];
      artists.forEach(a => {
        const opt = document.createElement("option");
        opt.value = a;
        opt.textContent = a;
        filter.appendChild(opt);
      });
    }

    function renderList(data) {
      filteredTracks = data;
      list.innerHTML = "";
      data.forEach((t, i) => {
        const div = document.createElement("div");
        div.className = "track";
        div.innerHTML = `
          <span>${t.title} ／ ${t.artist}</span>
          <span class="favorite ${favorites.includes(t.title) ? 'active' : ''}">❤</span>
        `;
        div.onclick = (e) => {
          if (e.target.classList.contains("favorite")) {
            toggleFavorite(t.title, e.target);
            e.stopPropagation();
          } else {
            current = i;
            loadTrack(current);
            player.play();
          }
        };
        list.appendChild(div);
      });
    }

    function loadTrack(index) {
      const track = filteredTracks[index] || filteredTracks[0];
      if (!track) return;
      player.src = track.url;
      info.textContent = `${track.title} ／ ${track.artist}`;
    }

    function toggleFavorite(title, el) {
      if (favorites.includes(title)) {
        favorites = favorites.filter(f => f !== title);
        el.classList.remove("active");
      } else {
        favorites.push(title);
        el.classList.add("active");
      }
      localStorage.setItem("favorites", JSON.stringify(favorites));
    }

    // 再生制御
    document.getElementById("playBtn").onclick = () => player.paused ? player.play() : player.pause();
    document.getElementById("prevBtn").onclick = () => {
      current = (current - 1 + filteredTracks.length) % filteredTracks.length;
      loadTrack(current); player.play();
    };
    document.getElementById("nextBtn").onclick = () => {
      current = (current + 1) % filteredTracks.length;
      loadTrack(current); player.play();
    };

    player.onended = () => {
      current = (current + 1) % filteredTracks.length;
      loadTrack(current);
      player.play();
    };

    // 検索機能
    search.oninput = () => applyFilters();
    filter.onchange = () => applyFilters();

    function applyFilters() {
      const keyword = search.value.toLowerCase();
      const artist = filter.value;
      const result = tracks.filter(t => 
        (!artist || t.artist === artist) &&
        (t.title.toLowerCase().includes(keyword) || t.artist.toLowerCase().includes(keyword))
      );
      renderList(result);
    }

    init();
  </script>
</body>
</html>
