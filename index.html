<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ミュージックプレイヤー 🎧</title>

<!-- ✅ サイトアイコン -->
<link rel="icon" href="https://raw.githubusercontent.com/j20252097/a/refs/heads/main/Guild.png" />
<link rel="apple-touch-icon" href="https://raw.githubusercontent.com/j20252097/a/refs/heads/main/Guild.png" />

<!-- ✅ PWA対応 -->
<link rel="manifest" href="manifest.json" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="ミュージックプレイヤー 🎧" />
<meta name="theme-color" content="#a58ff7" />

<style>
body {
  font-family: "Hiragino Sans", "Noto Sans JP", sans-serif;
  margin: 0; padding: 0;
  background: linear-gradient(135deg,#fcecff,#eafff8,#e0e8ff);
  min-height: 100vh;
  overflow-x: hidden; overflow-y: auto;
}
canvas#wave {
  position: fixed; top: 0; left: 0;
  width: 100vw; height: 100vh;
  z-index: 0; opacity: 0.4;
  pointer-events: none;
}
h1 {
  text-align: center;
  font-size: 2em;
  color: #6a5acd;
  padding-top: 30px;
  z-index: 2;
  position: relative;
}
#player {
  background: rgba(255,255,255,0.9);
  border-radius: 16px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.1);
  max-width: 700px;
  margin: 20px auto 60px;
  padding: 20px;
  text-align: center;
  position: relative;
  z-index: 2;
}
video {
  width: 100%;
  border-radius: 12px;
  background: #000;
}
#info { font-size: 1.2em; margin-top: 10px; color: #444; }
#progressContainer {
  width: 100%; height: 10px;
  background: #ddd;
  border-radius: 5px;
  margin: 10px 0;
  cursor: pointer;
}
#progressBar {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg,#a58ff7,#ff8cb0);
  border-radius: 5px;
}
#timeDisplay {
  display: flex;
  justify-content: space-between;
  font-size: 0.9em;
  color: #666;
}
button {
  background: #a58ff7;
  color: #fff;
  border: none;
  border-radius: 8px;
  padding: 10px 16px;
  font-size: 1em;
  cursor: pointer;
  transition: 0.2s;
}
button:hover { background: #8c73e6; }
button.active { background: #ff8cb0; }
#controls, #extraControls, #settings, #eqPanel {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 15px;
}
.sliderContainer {
  width: 90%;
  max-width: 400px;
  text-align: left;
}
.sliderContainer label {
  font-size: 0.9em;
  color: #555;
}
input[type="range"] {
  width: 100%;
  accent-color: #a58ff7;
}
#trackList {
  margin-top: 20px;
  max-height: 250px;
  overflow-y: auto;
  text-align: left;
}
.track {
  background: #fff;
  border-radius: 10px;
  padding: 10px;
  margin: 6px 0;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
  display: flex;
  justify-content: space-between;
  align-items: center;
  cursor: pointer;
}
.track.playing {
  background: linear-gradient(90deg,#e8e2ff,#fff);
  border-left: 5px solid #a58ff7;
}
.favorite { color: #ccc; font-size: 1.2em; cursor: pointer; }
.favorite.active { color: #ff6781; }
footer { text-align: center; margin: 30px 0; color: #666; }
</style>
</head>

<body>
<canvas id="wave"></canvas>
<h1>ミュージックプレイヤー 🎧</h1>

<div id="player">
  <video id="videoPlayer" controls playsinline></video>
  <div id="info"></div>

  <div id="progressContainer"><div id="progressBar"></div></div>
  <div id="timeDisplay"><span id="currentTime">0:00</span><span id="duration">0:00</span></div>

  <div id="controls">
    <button id="prevBtn">⏮ 前へ</button>
    <button id="playBtn">▶️ / ⏸</button>
    <button id="nextBtn">⏭ 次へ</button>
  </div>

  <div id="extraControls">
    <button id="shuffleBtn">🔀 シャッフル</button>
    <button id="repeatBtn">🔁 リピート: オフ</button>
    <button id="favModeBtn">❤️ お気に入りのみ</button>
  </div>

  <div id="settings">
    <div class="sliderContainer">
      <label>🔊 音量: <span id="volumeValue"></span></label>
      <input type="range" id="volumeSlider" min="0" max="1" step="0.01">
    </div>
    <div class="sliderContainer">
      <label>⚡ 再生速度: <span id="speedValue"></span>x</label>
      <input type="range" id="speedSlider" min="0.5" max="2" step="0.1">
    </div>
  </div>

  <div id="eqPanel">
    <div class="sliderContainer"><label>低音</label><input type="range" id="eq0" min="-12" max="12" step="1"></div>
    <div class="sliderContainer"><label>中低音</label><input type="range" id="eq1" min="-12" max="12" step="1"></div>
    <div class="sliderContainer"><label>中音</label><input type="range" id="eq2" min="-12" max="12" step="1"></div>
    <div class="sliderContainer"><label>高音</label><input type="range" id="eq3" min="-12" max="12" step="1"></div>
  </div>

  <input type="text" id="searchBox" placeholder="🔍 曲名やアーティストで検索..." />
  <select id="artistFilter"><option value="">すべてのアーティスト</option></select>
  <div id="trackList"></div>
</div>

<footer>© 2025 MusicProject 🎶</footer>

<script>
let tracks=[],filteredTracks=[],current=0,favorites=JSON.parse(localStorage.getItem("favorites")||"[]");
let shuffle=JSON.parse(localStorage.getItem("shuffle")||"false"),repeat=localStorage.getItem("repeat")||"off";
let favMode=JSON.parse(localStorage.getItem("favMode")||"false");
let volume=parseFloat(localStorage.getItem("volume")||"0.8"),speed=parseFloat(localStorage.getItem("speed")||"1.0");
const player=document.getElementById("videoPlayer"),info=document.getElementById("info"),list=document.getElementById("trackList");
const progressBar=document.getElementById("progressBar"),progressContainer=document.getElementById("progressContainer");
const currentTimeDisplay=document.getElementById("currentTime"),durationDisplay=document.getElementById("duration");
const volumeSlider=document.getElementById("volumeSlider"),speedSlider=document.getElementById("speedSlider");
const volumeValue=document.getElementById("volumeValue"),speedValue=document.getElementById("speedValue");
let audioCtx,sourceNode,analyser,eqNodes=[],thumbCache={};

async function init(){
  const res=await fetch("tracks.json"); tracks=await res.json();
  populateArtists(); applyFilters(); loadTrack(0);
  setupEQ(); drawWave(); setupAudioControls(); updateButtons();
}

/* 🎧 MediaSession */
function updateMediaSession(track,artworkURL){
  if(!('mediaSession' in navigator)) return;
  navigator.mediaSession.metadata=new MediaMetadata({
    title:track.title, artist:track.artist,
    artwork:[{src:artworkURL||"https://raw.githubusercontent.com/j20252097/a/refs/heads/main/Guild.png",sizes:"512x512",type:"image/png"}]
  });
  navigator.mediaSession.setActionHandler('play',()=>player.play());
  navigator.mediaSession.setActionHandler('pause',()=>player.pause());
  navigator.mediaSession.setActionHandler('previoustrack',()=>prevTrack());
  navigator.mediaSession.setActionHandler('nexttrack',()=>nextTrack());
}

/* 🎞️ 10秒後自動ジャケット生成 */
function autoCaptureArtwork(track){
  if(thumbCache[track.url]){updateMediaSession(track,thumbCache[track.url]);return;}
  player.addEventListener("timeupdate",function captureOnce(){
    if(player.currentTime>=10){
      const canvas=document.createElement("canvas");
      canvas.width=128; canvas.height=128;
      const ctx=canvas.getContext("2d");
      ctx.drawImage(player,0,0,canvas.width,canvas.height);
      canvas.toBlob(blob=>{
        const url=URL.createObjectURL(blob);
        thumbCache[track.url]=url;
        updateMediaSession(track,url);
      },"image/png");
      player.removeEventListener("timeupdate",captureOnce);
    }
  });
}

/* EQ設定 */
function setupEQ(){
  audioCtx=new AudioContext(); sourceNode=audioCtx.createMediaElementSource(player);
  const freqs=[100,300,1000,5000];
  eqNodes=freqs.map(f=>{const filter=audioCtx.createBiquadFilter();filter.type="peaking";filter.frequency.value=f;filter.Q.value=1;filter.gain.value=0;return filter;});
  analyser=audioCtx.createAnalyser(); analyser.fftSize=2048;
  sourceNode.connect(eqNodes[0]); eqNodes.reduce((a,b)=>(a.connect(b),b));
  eqNodes[eqNodes.length-1].connect(analyser); analyser.connect(audioCtx.destination);
  for(let i=0;i<eqNodes.length;i++){const s=document.getElementById("eq"+i);s.value=eqNodes[i].gain.value;s.oninput=()=>{eqNodes[i].gain.value=parseFloat(s.value);};}
  player.addEventListener("play",()=>audioCtx.resume());
}

/* 🎶 再生制御 */
function nextTrack() {
  if (shuffle) {
    let next;
    do { next = Math.floor(Math.random() * filteredTracks.length); }
    while (next === current && filteredTracks.length > 1);
    current = next;
  } else {
    current++;
    if (current >= filteredTracks.length) {
      if (repeat === "all") current = 0;
      else { player.pause(); return; }
    }
  }
  loadTrack(current);
  player.play();
}

function prevTrack() {
  if (shuffle) {
    let prev;
    do { prev = Math.floor(Math.random() * filteredTracks.length); }
    while (prev === current && filteredTracks.length > 1);
    current = prev;
  } else {
    current--;
    if (current < 0) current = filteredTracks.length - 1;
  }
  loadTrack(current);
  player.play();
}

player.onended = () => {
  if (repeat === "one") {
    player.currentTime = 0;
    player.play();
  } else {
    nextTrack();
  }
};

/* UI・リストなど */
function updateButtons(){
  document.getElementById("shuffleBtn").classList.toggle("active",shuffle);
  document.getElementById("favModeBtn").classList.toggle("active",favMode);
  document.getElementById("repeatBtn").textContent=repeat==="one"?"🔂 リピート: 1曲":repeat==="all"?"🔁 リピート: 全体":"🔁 リピート: オフ";
}
document.getElementById("shuffleBtn").onclick=()=>{shuffle=!shuffle;localStorage.setItem("shuffle",shuffle);updateButtons();};
document.getElementById("repeatBtn").onclick=()=>{repeat=repeat==="off"?"one":repeat==="one"?"all":"off";localStorage.setItem("repeat",repeat);updateButtons();};
document.getElementById("favModeBtn").onclick=()=>{favMode=!favMode;localStorage.setItem("favMode",favMode);applyFilters();updateButtons();};

function populateArtists(){const artists=[...new Set(tracks.map(t=>t.artist))];artists.forEach(a=>{const o=document.createElement("option");o.value=a;o.textContent=a;artistFilter.appendChild(o);});}
function applyFilters(){const k=searchBox.value.toLowerCase(),a=artistFilter.value;let r=tracks.filter(t=>(!a||t.artist===a)&&(t.title.toLowerCase().includes(k)||t.artist.toLowerCase().includes(k)));if(favMode)r=r.filter(t=>favorites.includes(t.title));renderList(r);}
function renderList(d){filteredTracks=d;list.innerHTML="";d.forEach((t,i)=>{const div=document.createElement("div");div.className="track"+(i===current?" playing":"");div.innerHTML=`<span>${t.title} ／ ${t.artist}</span><span class="favorite ${favorites.includes(t.title)?'active':''}">❤</span>`;div.onclick=e=>{if(e.target.classList.contains("favorite")){toggleFav(t.title,e.target);return;}current=i;loadTrack(current);player.play();};list.appendChild(div);});}
function toggleFav(t,e){if(favorites.includes(t)){favorites=favorites.filter(f=>f!==t);e.classList.remove("active");}else{favorites.push(t);e.classList.add("active");}localStorage.setItem("favorites",JSON.stringify(favorites));}

player.ontimeupdate=()=>{if(!player.duration)return;const p=(player.currentTime/player.duration)*100;progressBar.style.width=p+"%";currentTimeDisplay.textContent=format(player.currentTime);durationDisplay.textContent=format(player.duration);};
progressContainer.onclick=e=>{const r=progressContainer.getBoundingClientRect();player.currentTime=((e.clientX-r.left)/r.width)*player.duration;};
function format(s){const m=Math.floor(s/60),sec=Math.floor(s%60);return`${m}:${sec.toString().padStart(2,"0")}`;}
document.getElementById("playBtn").onclick=()=>player.paused?player.play():player.pause();
document.getElementById("prevBtn").onclick=prevTrack;
document.getElementById("nextBtn").onclick=nextTrack;

/* 音量・速度 */
function setupAudioControls(){volumeSlider.value=volume;volumeValue.textContent=Math.round(volume*100);speedSlider.value=speed;speedValue.textContent=speed.toFixed(1);volumeSlider.oninput=()=>{volume=parseFloat(volumeSlider.value);player.volume=volume;volumeValue.textContent=Math.round(volume*100);localStorage.setItem("volume",volume);};speedSlider.oninput=()=>{speed=parseFloat(speedSlider.value);player.playbackRate=speed;speedValue.textContent=speed.toFixed(1);localStorage.setItem("speed",speed);};}

/* 波形 */
function drawWave(){const c=document.getElementById("wave"),ctx=c.getContext("2d");let w,h;function r(){w=c.width=innerWidth;h=c.height=innerHeight;}window.onresize=r;r();const d=new Uint8Array(2048);function draw(){requestAnimationFrame(draw);if(!analyser)return;analyser.getByteTimeDomainData(d);ctx.clearRect(0,0,w,h);ctx.lineWidth=2;ctx.strokeStyle="rgba(130,120,255,0.2)";ctx.beginPath();for(let i=0;i<d.length;i++){const x=(i/d.length)*w;const y=h/2+(d[i]-128);if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);}ctx.stroke();}draw();}
init();
</script>
</body>
</html>
