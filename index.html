<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ミュージックプレイヤー 🎧</title>

<!-- ✅ サイトアイコン -->
<link rel="icon" href="https://raw.githubusercontent.com/j20252097/a/refs/heads/main/Guild.png" />
<link rel="apple-touch-icon" href="https://raw.githubusercontent.com/j20252097/a/refs/heads/main/Guild.png" />

<!-- ✅ PWA対応 -->
<link rel="manifest" href="manifest.json" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="ミュージックプレイヤー 🎧" />
<meta name="theme-color" content="#a58ff7" />

<style>
body {
  font-family: "Hiragino Sans", "Noto Sans JP", sans-serif;
  margin: 0; padding: 0;
  background: linear-gradient(135deg,#fcecff,#eafff8,#e0e8ff);
  min-height: 100vh;
  overflow-x: hidden; overflow-y: auto;
}
canvas#wave {
  position: fixed; top: 0; left: 0;
  width: 100vw; height: 100vh;
  z-index: 0; opacity: 0.4;
  pointer-events: none;
}
h1 {
  text-align: center; font-size: 2em; color: #6a5acd;
  padding-top: 30px; z-index: 2; position: relative;
}
#player {
  background: rgba(255,255,255,0.9);
  border-radius: 16px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.1);
  max-width: 700px; margin: 20px auto 60px; padding: 20px;
  text-align: center; position: relative; z-index: 2;
}
video { width: 100%; border-radius: 12px; background: #000; }
#info { font-size: 1.2em; margin-top: 10px; color: #444; }
#progressContainer {
  width: 100%; height: 10px; background: #ddd; border-radius: 5px;
  margin: 10px 0; cursor: pointer;
}
#progressBar {
  height: 100%; width: 0%; background: linear-gradient(90deg,#a58ff7,#ff8cb0); border-radius: 5px;
}
#timeDisplay {
  display: flex; justify-content: space-between; font-size: 0.9em; color: #666;
}
button {
  background: #a58ff7; color: #fff; border: none; border-radius: 8px;
  padding: 10px 16px; font-size: 1em; cursor: pointer; transition: 0.2s;
}
button:hover { background: #8c73e6; } 
button.active { background: #ff8cb0; }
#controls,#extraControls,#settings {
  display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; margin-top: 15px;
}
.sliderContainer { width: 90%; max-width: 400px; text-align: left; }
.sliderContainer label { font-size: 0.9em; color: #555; }
input[type="range"] { width: 100%; accent-color: #a58ff7; }
#trackList { margin-top: 20px; max-height: 250px; overflow-y: auto; text-align: left; }
.track {
  background: #fff; border-radius: 10px; padding: 10px; margin: 6px 0;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
  display: flex; justify-content: space-between; align-items: center; cursor: pointer;
}
.track.playing { background: linear-gradient(90deg,#e8e2ff,#fff); border-left: 5px solid #a58ff7; }
.favorite { color: #ccc; font-size: 1.2em; cursor: pointer; }
.favorite.active { color: #ff6781; }
footer { text-align: center; margin: 30px 0; color: #666; }
</style>
</head>

<body>
<canvas id="wave"></canvas>
<h1>ミュージックプレイヤー 🎧</h1>

<div id="player">
  <video id="videoPlayer" controls playsinline></video>
  <div id="info"></div>

  <div id="progressContainer"><div id="progressBar"></div></div>
  <div id="timeDisplay"><span id="currentTime">0:00</span><span id="duration">0:00</span></div>

  <div id="controls">
    <button id="prevBtn">⏮ 前へ</button>
    <button id="playBtn">▶️ / ⏸</button>
    <button id="nextBtn">⏭ 次へ</button>
  </div>

  <div id="extraControls">
    <button id="shuffleBtn">🔀 シャッフル</button>
    <button id="repeatBtn">🔁 リピート: オフ</button>
    <button id="favModeBtn">❤️ お気に入りのみ</button>
  </div>

  <div id="settings">
    <div class="sliderContainer">
      <label>🔊 音量: <span id="volumeValue"></span></label>
      <input type="range" id="volumeSlider" min="0" max="1" step="0.01">
    </div>
    <div class="sliderContainer">
      <label>⚡ 再生速度: <span id="speedValue"></span>x</label>
      <input type="range" id="speedSlider" min="0.5" max="2" step="0.1">
    </div>
  </div>

  <input type="text" id="searchBox" placeholder="🔍 曲名やアーティストで検索..." />
  <select id="artistFilter"><option value="">すべてのアーティスト</option></select>
  <div id="trackList"></div>
</div>

<footer>© 2025 MusicProject 🎶</footer>

<script>
let tracks=[],filteredTracks=[],current=0;
let favorites=JSON.parse(localStorage.getItem("favorites")||"[]");
let shuffle=JSON.parse(localStorage.getItem("shuffle")||"false");
let repeat=localStorage.getItem("repeat")||"off";
let favMode=JSON.parse(localStorage.getItem("favMode")||"false");
let volume=parseFloat(localStorage.getItem("volume")||"0.8");
let speed=parseFloat(localStorage.getItem("speed")||"1.0");

const player=document.getElementById("videoPlayer");
const info=document.getElementById("info");
const list=document.getElementById("trackList");
const searchBox=document.getElementById("searchBox");
const filter=document.getElementById("artistFilter");
const progressBar=document.getElementById("progressBar");
const progressContainer=document.getElementById("progressContainer");
const currentTimeDisplay=document.getElementById("currentTime");
const durationDisplay=document.getElementById("duration");
const volumeSlider=document.getElementById("volumeSlider");
const speedSlider=document.getElementById("speedSlider");
const volumeValue=document.getElementById("volumeValue");
const speedValue=document.getElementById("speedValue");
let analyser,audioCtx;

/* 🎵 初期化 */
async function init(){
  try {
    const res=await fetch("tracks.json");
    tracks=await res.json();
    populateArtists(); applyFilters(); loadTrack(0);
    setupAudioControls(); drawWave(); updateButtons();
  } catch(e){ console.error("tracks.jsonの読み込み失敗:",e); }
}

/* 🎶 再生関連 */
function loadTrack(i){
  if(!filteredTracks.length)return;
  const track=filteredTracks[i]||filteredTracks[0];
  if(!track.url)return;
  current=i;
  player.src=track.url;
  player.volume=volume;
  player.playbackRate=speed;
  info.textContent=`${track.title} ／ ${track.artist}`;
  highlight();
}
function nextTrack(){
  if(shuffle){
    let n;do{n=Math.floor(Math.random()*filteredTracks.length);}while(n===current&&filteredTracks.length>1);
    current=n;
  }else{
    current++;
    if(current>=filteredTracks.length){
      if(repeat==="all")current=0;else{player.pause();return;}
    }
  }
  loadTrack(current);player.play();
}
function prevTrack(){
  if(shuffle){
    let n;do{n=Math.floor(Math.random()*filteredTracks.length);}while(n===current&&filteredTracks.length>1);
    current=n;
  }else{
    current--;if(current<0)current=filteredTracks.length-1;
  }
  loadTrack(current);player.play();
}
player.onended=()=>{repeat==="one"?(player.currentTime=0,player.play()):nextTrack();};

/* 🎧 UI操作 */
document.getElementById("playBtn").onclick=()=>player.paused?player.play():player.pause();
document.getElementById("prevBtn").onclick=prevTrack;
document.getElementById("nextBtn").onclick=nextTrack;

/* 🔍 検索とフィルター */
function populateArtists(){
  const artists=[...new Set(tracks.map(t=>t.artist))];
  filter.innerHTML='<option value="">すべてのアーティスト</option>';
  artists.forEach(a=>{
    const o=document.createElement("option");
    o.value=a;o.textContent=a;filter.appendChild(o);
  });
}
function applyFilters(){
  const k=searchBox.value.toLowerCase(),a=filter.value;
  let r=tracks.filter(t=>(!a||t.artist===a)&&(t.title.toLowerCase().includes(k)||t.artist.toLowerCase().includes(k)));
  if(favMode)r=r.filter(t=>favorites.includes(t.title));
  renderList(r);
}
function renderList(d){
  filteredTracks=d;list.innerHTML="";
  d.forEach((t,i)=>{
    const div=document.createElement("div");
    div.className="track"+(i===current?" playing":"");
    div.innerHTML=`<span>${t.title} ／ ${t.artist}</span><span class="favorite ${favorites.includes(t.title)?'active':''}">❤</span>`;
    div.onclick=e=>{
      if(e.target.classList.contains("favorite")){toggleFav(t.title,e.target);return;}
      loadTrack(i);player.play();
    };
    list.appendChild(div);
  });
}
searchBox.oninput=applyFilters;
filter.onchange=applyFilters;

/* ❤️ お気に入り */
function toggleFav(t,e){
  if(favorites.includes(t)){favorites=favorites.filter(f=>f!==t);e.classList.remove("active");}
  else{favorites.push(t);e.classList.add("active");}
  localStorage.setItem("favorites",JSON.stringify(favorites));
}

/* 🌀 ボタン状態 */
function updateButtons(){
  document.getElementById("shuffleBtn").classList.toggle("active",shuffle);
  document.getElementById("favModeBtn").classList.toggle("active",favMode);
  document.getElementById("repeatBtn").textContent=
    repeat==="one"?"🔂 リピート: 1曲":
    repeat==="all"?"🔁 リピート: 全体":
    "🔁 リピート: オフ";
}
document.getElementById("shuffleBtn").onclick=()=>{shuffle=!shuffle;localStorage.setItem("shuffle",shuffle);updateButtons();};
document.getElementById("repeatBtn").onclick=()=>{repeat=repeat==="off"?"one":repeat==="one"?"all":"off";localStorage.setItem("repeat",repeat);updateButtons();};
document.getElementById("favModeBtn").onclick=()=>{favMode=!favMode;localStorage.setItem("favMode",favMode);applyFilters();updateButtons();};

/* ⏱️ 再生バー */
player.ontimeupdate=()=>{
  if(!player.duration)return;
  const p=(player.currentTime/player.duration)*100;
  progressBar.style.width=p+"%";
  currentTimeDisplay.textContent=format(player.currentTime);
  durationDisplay.textContent=format(player.duration);
};
progressContainer.onclick=e=>{
  const r=progressContainer.getBoundingClientRect();
  player.currentTime=((e.clientX-r.left)/r.width)*player.duration;
};
function format(s){const m=Math.floor(s/60),sec=Math.floor(s%60);return`${m}:${sec.toString().padStart(2,"0")}`;}
function highlight(){document.querySelectorAll(".track").forEach((el,i)=>el.classList.toggle("playing",i===current));}

/* 🔊 音量・速度 */
function setupAudioControls(){
  volumeSlider.value=volume;volumeValue.textContent=Math.round(volume*100);
  speedSlider.value=speed;speedValue.textContent=speed.toFixed(1);
  player.volume=volume;player.playbackRate=speed;
  volumeSlider.oninput=()=>{volume=parseFloat(volumeSlider.value);player.volume=volume;volumeValue.textContent=Math.round(volume*100);localStorage.setItem("volume",volume);};
  speedSlider.oninput=()=>{speed=parseFloat(speedSlider.value);player.playbackRate=speed;speedValue.textContent=speed.toFixed(1);localStorage.setItem("speed",speed);};
}

/* 🌊 波形アニメーション */
function drawWave(){
  const c=document.getElementById("wave"),ctx=c.getContext("2d");
  let w,h;function resize(){w=c.width=innerWidth;h=c.height=innerHeight;}window.onresize=resize;resize();
  ctx.strokeStyle="rgba(130,120,255,0.15)";
  function loop(){requestAnimationFrame(loop);
    const time=(Date.now()/2000);
    ctx.clearRect(0,0,w,h);
    ctx.beginPath();
    for(let x=0;x<w;x+=10){
      const y=h/2+Math.sin(x/80+time*4)*20;
      if(x===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
    }
    ctx.stroke();
  }
  loop();
}
init();
</script>
</body>
</html>
