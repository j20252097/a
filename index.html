<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>ミュージックプレイヤー 🎧</title>

<!-- アイコン / PWA -->
<link rel="icon" href="https://raw.githubusercontent.com/j20252097/a/refs/heads/main/Guild.png" />
<link rel="apple-touch-icon" href="https://raw.githubusercontent.com/j20252097/a/refs/heads/main/Guild.png" />
<link rel="manifest" href="manifest.json" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="ミュージックプレイヤー 🎧" />
<meta name="theme-color" content="#a58ff7" />

<style>
  :root{
    --accent:#a58ff7;
    --accent-2:#ff8cb0;
  }
  html,body{height:100%;margin:0;font-family:"Hiragino Sans","Noto Sans JP",sans-serif;background:linear-gradient(135deg,#fcecff,#eafff8,#e0e8ff);overflow-x:hidden;}
  #wave{position:fixed;left:0;top:0;width:100vw;height:100vh;z-index:0;pointer-events:none;opacity:0.35;}
  h1{text-align:center;color:#6a5acd;margin:28px 0 6px;z-index:2;position:relative;}
  #player{max-width:720px;margin:18px auto 60px;background:rgba(255,255,255,0.95);border-radius:14px;padding:18px;box-shadow:0 6px 24px rgba(0,0,0,0.08);position:relative;z-index:2;}
  audio{width:100%;display:none;} /* ブラウザ組み込みコントローラは使わない */
  #info{font-size:1.05rem;color:#333;margin-top:8px;text-align:center;}
  #progressContainer{width:100%;height:10px;background:#eee;border-radius:6px;margin:12px 0;cursor:pointer;position:relative;}
  #progressBar{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:6px;transition:width .1s linear;}
  #timeDisplay{display:flex;justify-content:space-between;font-size:0.85rem;color:#666;margin-top:6px;}
  #controls,#extraControls,#settings{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px;}
  button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font-size:1rem;transition:background .15s;}
  button:hover{background:#8c73e6;}
  button.active{background:var(--accent-2);}
  input[type="range"]{width:220px;accent-color:var(--accent);}
  .sliderContainer{width:90%;max-width:360px;text-align:left;}
  .sliderContainer label{display:block;font-size:0.9rem;color:#444;margin-bottom:6px;}
  #searchBox,#artistFilter{width:90%;max-width:360px;padding:8px;border-radius:8px;border:1px solid #ddd;margin:10px auto;display:block;}
  #trackList{margin-top:16px;max-height:320px;overflow:auto;padding:6px;}
  .track{background:#fff;border-radius:10px;padding:10px;margin:8px 6px;box-shadow:0 2px 6px rgba(0,0,0,0.06);display:flex;justify-content:space-between;align-items:center;cursor:pointer;}
  .track:hover{background:#f8f6ff;}
  .track.playing{background:linear-gradient(90deg,#eef0ff,#fff);border-left:5px solid var(--accent);}
  .favorite{font-size:1.1rem;color:#cfcfcf;cursor:pointer;margin-left:10px}
  .favorite.active{color:#ff6781}
  footer{text-align:center;color:#666;margin-bottom:26px}
  @media (max-width:520px){
    input[type="range"]{width:160px;}
  }
</style>
</head>
<body>

<canvas id="wave"></canvas>

<h1>ミュージックプレイヤー 🎧</h1>

<div id="player">
  <!-- audio element（visible controlsは使わず独自UIで制御） -->
  <audio id="audioPlayer" preload="metadata"></audio>

  <div id="info">読み込み待ち...</div>

  <div id="progressContainer" title="クリックでシーク">
    <div id="progressBar"></div>
  </div>
  <div id="timeDisplay"><span id="currentTime">0:00</span><span id="duration">0:00</span></div>

  <div id="controls">
    <button id="prevBtn">⏮ 前へ</button>
    <button id="playBtn">▶️ 再生</button>
    <button id="nextBtn">⏭ 次へ</button>
  </div>

  <div id="extraControls">
    <button id="shuffleBtn">🔀 シャッフル</button>
    <button id="repeatBtn">🔁 リピート: オフ</button>
    <button id="favModeBtn">❤️ お気に入りのみ</button>
  </div>

  <div id="settings">
    <div class="sliderContainer">
      <label>🔊 音量: <span id="volumeValue">80</span>%</label>
      <input type="range" id="volumeSlider" min="0" max="1" step="0.01" />
    </div>
    <div class="sliderContainer">
      <label>⚡ 再生速度: <span id="speedValue">1.0</span>x</label>
      <input type="range" id="speedSlider" min="0.5" max="2" step="0.1" />
    </div>
  </div>

  <input id="searchBox" placeholder="🔍 曲名やアーティストで検索..." />
  <select id="artistFilter"><option value="">すべてのアーティスト</option></select>

  <div id="trackList"></div>
</div>

<footer>© 2025 MusicProject 🎶</footer>

<script>
/* ---------------------------
   全てaudio再生版 完全版
   - tracks.json を同ディレクトリに配置
   - tracks.json の url は絶対URL推奨
   --------------------------- */

const audio = document.getElementById('audioPlayer');
const playBtn = document.getElementById('playBtn');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const shuffleBtn = document.getElementById('shuffleBtn');
const repeatBtn = document.getElementById('repeatBtn');
const favModeBtn = document.getElementById('favModeBtn');
const progressContainer = document.getElementById('progressContainer');
const progressBar = document.getElementById('progressBar');
const currentTimeEl = document.getElementById('currentTime');
const durationEl = document.getElementById('duration');
const volumeSlider = document.getElementById('volumeSlider');
const speedSlider = document.getElementById('speedSlider');
const volumeValue = document.getElementById('volumeValue');
const speedValue = document.getElementById('speedValue');
const info = document.getElementById('info');
const searchBox = document.getElementById('searchBox');
const artistFilter = document.getElementById('artistFilter');
const trackListEl = document.getElementById('trackList');

let tracks = [];                // 全トラック（objects）
let filteredIndices = [];       // 表示中の tracks の index（tracks配列への参照）
let currentFilteredIndex = 0;   // filteredIndices 配列中の位置
let currentTrackIndex = 0;      // tracks 配列中の位置 (tracks[currentTrackIndex])
let favorites = JSON.parse(localStorage.getItem('favorites')||'[]');
let shuffle = JSON.parse(localStorage.getItem('shuffle')||'false');
let repeat = localStorage.getItem('repeat')||'off'; // "off" | "one" | "all"
let favMode = JSON.parse(localStorage.getItem('favMode')||'false');
let volume = parseFloat(localStorage.getItem('volume')||'0.8');
let speed = parseFloat(localStorage.getItem('speed')||'1.0');

const RECENT_HISTORY_SIZE = 10;
let recentlyPlayed = []; // random history to avoid repeats

/* ---------------------------
   utility
   --------------------------- */
function fmtTime(sec){
  if (!isFinite(sec)) return '0:00';
  const m = Math.floor(sec/60);
  const s = Math.floor(sec%60);
  return m + ':' + String(s).padStart(2,'0');
}
function saveSettings(){
  localStorage.setItem('shuffle', JSON.stringify(shuffle));
  localStorage.setItem('repeat', repeat);
  localStorage.setItem('favMode', JSON.stringify(favMode));
  localStorage.setItem('volume', String(volume));
  localStorage.setItem('speed', String(speed));
}

/* ---------------------------
   トラック読み込み & 初期化（遅延ロード：初回再生時に fetch する）
   --------------------------- */
async function loadTracksIfNeeded(){
  if (tracks.length) return;
  try {
    const res = await fetch('tracks.json', {cache: "no-store"});
    tracks = await res.json();
    // tracks expected: [{ "title": "...", "artist":"...", "url":"https://.../file.mp3" }, ...]
    // populate artists & list
    populateArtists();
    applyFilters(); // sets filteredIndices & renders list
    // restore last saved position if exists
    const saved = parseInt(localStorage.getItem('currentTrackIndex'));
    if (!isNaN(saved) && saved >=0 && saved < tracks.length) {
      // find position in filteredIndices (if current filter includes it)
      currentTrackIndex = saved;
      const pos = filteredIndices.indexOf(currentTrackIndex);
      currentFilteredIndex = pos >= 0 ? pos : 0;
    } else {
      currentFilteredIndex = 0;
    }
    // load current (do not auto-play)
    loadTrackByFilteredIndex(currentFilteredIndex, false);
  } catch(e){
    console.error('tracks.json の読み込み失敗', e);
    info.textContent = 'tracks.json の読み込みに失敗しました';
  }
}

/* ---------------------------
   フィルタ・リスト描画
   filteredIndices は tracks 配列の index の配列
   --------------------------- */
function populateArtists(){
  const artists = [...new Set(tracks.map(t => t.artist).filter(Boolean))].sort();
  artistFilter.innerHTML = '<option value="">すべてのアーティスト</option>';
  artists.forEach(a => {
    const o = document.createElement('option');
    o.value = a; o.textContent = a;
    artistFilter.appendChild(o);
  });
}

function applyFilters(){
  const kw = (searchBox.value || '').trim().toLowerCase();
  const artist = artistFilter.value;
  filteredIndices = tracks.map((t,i)=>i).filter(i=>{
    const t0 = tracks[i];
    if (!t0) return false;
    if (artist && t0.artist !== artist) return false;
    if (kw && !( (t0.title||'').toLowerCase().includes(kw) || (t0.artist||'').toLowerCase().includes(kw) )) return false;
    if (favMode && !favorites.includes(t0.title)) return false;
    return true;
  });
  // If currentTrackIndex not in filteredIndices, reset to 0
  if (!filteredIndices.length) {
    trackListEl.innerHTML = '<div style="padding:10px;color:#777">該当する曲がありません</div>';
    info.textContent = 'トラック無し';
    return;
  }
  // render
  renderList();
}

/* renders the visible list from filteredIndices */
function renderList(){
  trackListEl.innerHTML = '';
  filteredIndices.forEach((trackIdx, idxInFiltered) => {
    const t = tracks[trackIdx];
    const div = document.createElement('div');
    div.className = 'track' + (idxInFiltered === currentFilteredIndex ? ' playing' : '');
    const left = document.createElement('div');
    left.style.flex = '1';
    left.textContent = `${t.title} ／ ${t.artist}`;
    left.style.userSelect='none';
    left.onclick = () => { loadTrackByFilteredIndex(idxInFiltered, true); };

    const right = document.createElement('div');
    right.style.display='flex'; right.style.alignItems='center';
    const fav = document.createElement('span');
    fav.className = 'favorite' + (favorites.includes(t.title)?' active':'');
    fav.innerHTML = favorites.includes(t.title) ? '❤' : '♡';
    fav.title = favorites.includes(t.title) ? 'お気に入り解除' : 'お気に入りに追加';
    fav.onclick = (e) => { e.stopPropagation(); toggleFavorite(t.title, fav); };

    right.appendChild(fav);
    div.appendChild(left);
    div.appendChild(right);
    trackListEl.appendChild(div);
  });
}

/* ---------------------------
   再生制御
   - filteredIndices を基準に再生
   - firstPlay: true なら play() を呼ぶ（ユーザー操作の中で呼べば iOS PWA OK）
   --------------------------- */
function loadTrackByFilteredIndex(filteredIdx, shouldPlay){
  if (!filteredIndices.length) return;
  if (filteredIdx < 0) filteredIdx = 0;
  if (filteredIdx >= filteredIndices.length) filteredIdx = 0;
  currentFilteredIndex = filteredIdx;
  currentTrackIndex = filteredIndices[currentFilteredIndex];
  const t = tracks[currentTrackIndex];
  if (!t) return;
  audio.src = t.url;
  audio.volume = volume;
  audio.playbackRate = speed;
  info.textContent = `${t.title} ／ ${t.artist}`;
  // update UI list highlight
  renderList();
  saveCurrentTrackIndex();
  updateMediaSession(t);
  if (shouldPlay) {
    const p = audio.play();
    if (p && p.then) p.catch(()=>{/* ignore */});
  }
}

/* 次・前 */
function determineNextIndex(){
  if (!filteredIndices.length) return null;
  if (shuffle) {
    // choose random that isn't current (try few times)
    if (filteredIndices.length === 1) return currentFilteredIndex;
    let attempts = 0;
    let pick;
    do {
      pick = Math.floor(Math.random() * filteredIndices.length);
      attempts++;
    } while (pick === currentFilteredIndex && attempts < 8);
    // remember recentlyPlayed
    const pickedTrackIdx = filteredIndices[pick];
    // avoid exact repetition over recentlyPlayed
    if (!recentlyPlayed.includes(pickedTrackIdx)) {
      recentlyPlayed.unshift(pickedTrackIdx);
      if (recentlyPlayed.length > RECENT_HISTORY_SIZE) recentlyPlayed.pop();
      return pick;
    } else {
      // fallback to linear next
      return (currentFilteredIndex + 1) % filteredIndices.length;
    }
  } else {
    // sequential
    let next = currentFilteredIndex + 1;
    if (next >= filteredIndices.length) {
      if (repeat === 'all') next = 0;
      else return null; // stop
    }
    return next;
  }
}

function nextTrack(){
  const ni = determineNextIndex();
  if (ni === null) { audio.pause(); return; }
  loadTrackByFilteredIndex(ni, true);
}
function prevTrack(){
  if (!filteredIndices.length) return;
  if (shuffle) {
    // random prev same as random next
    const pick = Math.floor(Math.random() * filteredIndices.length);
    loadTrackByFilteredIndex(pick, true);
  } else {
    let prev = currentFilteredIndex - 1;
    if (prev < 0) prev = filteredIndices.length - 1;
    loadTrackByFilteredIndex(prev, true);
  }
}

/* ---------------------------
   favorites
   --------------------------- */
function toggleFavorite(title, el){
  if (!title) return;
  if (favorites.includes(title)){
    favorites = favorites.filter(x=>x!==title);
  } else {
    favorites.push(title);
  }
  localStorage.setItem('favorites', JSON.stringify(favorites));
  applyFilters(); // re-render list respecting favorite-only mode
}

/* ---------------------------
   MediaSession (ロック画面 / コントロール)
   --------------------------- */
function updateMediaSession(track){
  if (!('mediaSession' in navigator)) return;
  try {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: track.title || '',
      artist: track.artist || '',
      artwork: [
        { src: 'https://raw.githubusercontent.com/j20252097/a/refs/heads/main/Guild.png', sizes:'512x512', type:'image/png' }
      ]
    });
    navigator.mediaSession.setActionHandler('play', ()=> audio.play());
    navigator.mediaSession.setActionHandler('pause', ()=> audio.pause());
    navigator.mediaSession.setActionHandler('previoustrack', ()=> prevTrack());
    navigator.mediaSession.setActionHandler('nexttrack', ()=> nextTrack());
    // optional: setPositionState if available (helpful)
    if (navigator.mediaSession.setPositionState && audio.duration && !isNaN(audio.duration)) {
      try {
        navigator.mediaSession.setPositionState({
          duration: audio.duration,
          playbackRate: audio.playbackRate,
          position: audio.currentTime
        });
      } catch(e){ /* ignore */ }
    }
  } catch(e){
    console.warn('MediaSession error', e);
  }
}

/* ---------------------------
   UI events
   --------------------------- */

playBtn.addEventListener('click', async () => {
  // ensure tracks loaded on first user gesture
  if (!tracks.length) {
    await loadTracksIfNeeded();
  }
  // If audio.src not set, load currentFilteredIndex
  if (!audio.src && filteredIndices.length) {
    loadTrackByFilteredIndex(currentFilteredIndex, false);
  }
  // play/pause toggle
  if (audio.paused) {
    // For iOS PWA, creating AudioContext before a user gesture may block audio.
    // We avoid using AudioContext here. Simple .play() on <audio> in user gesture works.
    try { await audio.play(); playBtn.textContent = '⏸ 停止'; } catch(e){ console.warn('play failed', e); }
  } else {
    audio.pause(); playBtn.textContent = '▶️ 再生';
  }
});

prevBtn.addEventListener('click', () => {
  if (!tracks.length) return;
  prevTrack();
});

nextBtn.addEventListener('click', () => {
  if (!tracks.length) return;
  nextTrack();
});

shuffleBtn.addEventListener('click', () => {
  shuffle = !shuffle;
  shuffleBtn.classList.toggle('active', shuffle);
  saveSettings();
  // reset recentlyPlayed to refresh randomness
  recentlyPlayed = [];
});

repeatBtn.addEventListener('click', () => {
  repeat = repeat === 'off' ? 'one' : repeat === 'one' ? 'all' : 'off';
  repeatBtn.classList.toggle('active', repeat !== 'off');
  repeatBtn.textContent = repeat === 'one' ? '🔂 リピート: 1曲' : repeat === 'all' ? '🔁 リピート: 全体' : '🔁 リピート: オフ';
  saveSettings();
});

favModeBtn.addEventListener('click', () => {
  favMode = !favMode;
  favModeBtn.classList.toggle('active', favMode);
  localStorage.setItem('favMode', JSON.stringify(favMode));
  applyFilters();
});

/* volume & speed */
volumeSlider.value = volume;
volumeValue.textContent = Math.round(volume*100);
volumeSlider.addEventListener('input', () => {
  volume = parseFloat(volumeSlider.value);
  audio.volume = volume;
  volumeValue.textContent = Math.round(volume*100);
  localStorage.setItem('volume', String(volume));
});
speedSlider.value = speed;
speedValue.textContent = speed.toFixed(1);
speedSlider.addEventListener('input', () => {
  speed = parseFloat(speedSlider.value);
  audio.playbackRate = speed;
  speedValue.textContent = speed.toFixed(1);
  localStorage.setItem('speed', String(speed));
});

/* search & artist filter */
searchBox.addEventListener('input', applyFilters);
artistFilter.addEventListener('change', applyFilters);

/* clicking progress bar seeks */
progressContainer.addEventListener('click', (e) => {
  if (!audio.duration) return;
  const rect = progressContainer.getBoundingClientRect();
  const pos = (e.clientX - rect.left) / rect.width;
  audio.currentTime = pos * audio.duration;
});

/* audio time updates */
audio.addEventListener('timeupdate', () => {
  if (!audio.duration) return;
  const percent = (audio.currentTime / audio.duration) * 100;
  progressBar.style.width = percent + '%';
  currentTimeEl.textContent = fmtTime(audio.currentTime);
  durationEl.textContent = fmtTime(audio.duration);
  // update MediaSession position
  if (navigator.mediaSession && navigator.mediaSession.setPositionState) {
    try {
      navigator.mediaSession.setPositionState({ duration: audio.duration, playbackRate: audio.playbackRate, position: audio.currentTime });
    } catch(e){}
  }
});
audio.addEventListener('play', ()=> { playBtn.textContent = '⏸ 停止'; });
audio.addEventListener('pause', ()=> { playBtn.textContent = '▶️ 再生'; });

/* ended handling */
audio.addEventListener('ended', () => {
  if (repeat === 'one') {
    audio.currentTime = 0;
    audio.play();
  } else {
    nextTrack();
  }
});

/* ---------------------------
   recent/restore
   --------------------------- */
function saveCurrentTrackIndex(){
  localStorage.setItem('currentTrackIndex', String(currentTrackIndex));
}
function restoreLast(){
  const idx = parseInt(localStorage.getItem('currentTrackIndex'));
  if (!isNaN(idx) && idx >= 0 && idx < tracks.length) {
    // find in filteredIndices
    const pos = filteredIndices.indexOf(idx);
    if (pos >= 0) {
      currentFilteredIndex = pos;
      currentTrackIndex = idx;
      loadTrackByFilteredIndex(currentFilteredIndex, false);
    }
  }
}

/* ---------------------------
   decorative wave (音に同期しない、軽量アニメ)
   --------------------------- */
(function decorativeWave(){
  const c = document.getElementById('wave');
  const ctx = c.getContext('2d');
  let w=0,h=0;
  function onResize(){ w = c.width = innerWidth; h = c.height = innerHeight; }
  window.addEventListener('resize', onResize);
  onResize();
  let t = 0;
  function draw(){
    requestAnimationFrame(draw);
    t += 0.01;
    ctx.clearRect(0,0,w,h);
    for (let layer=0; layer<3; layer++){
      ctx.beginPath();
      const amp = 12 + layer*8;
      const freq = 0.004 + layer*0.003;
      for (let x=0; x<=w; x+=6){
        const y = h*0.5 + Math.sin((x*freq) + t*(1+layer*0.3) + layer) * amp * Math.sin(t*0.5 + layer);
        if (x===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      }
      ctx.strokeStyle = `rgba(120,100,255,${0.06+layer*0.06})`;
      ctx.lineWidth = 2;
      ctx.stroke();
    }
  }
  draw();
})();

/* ---------------------------
   初回設定（UIに既定値適用）
   --------------------------- */
(function initialUI(){
  // button states
  shuffleBtn.classList.toggle('active', shuffle);
  favModeBtn.classList.toggle('active', favMode);
  repeatBtn.textContent = repeat === 'one' ? '🔂 リピート: 1曲' : repeat === 'all' ? '🔁 リピート: 全体' : '🔁 リピート: オフ';
  repeatBtn.classList.toggle('active', repeat !== 'off');
  // audio settings
  audio.volume = volume;
  audio.playbackRate = speed;
  // wire keyboard space play/pause for convenience
  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space' && document.activeElement.tagName !== 'INPUT') {
      e.preventDefault();
      playBtn.click();
    }
  });
})();

/* ---------------------------
   initial load of minimal UI state (no tracks fetched until user taps play)
   but we still try to prefetch artists if tracks.json is accessible (non-blocking)
   --------------------------- */
(async function tryPreload(){
  // attempt to fetch tracks.json but do not require it; if fails, it's fine — will load on play.
  try {
    const r = await fetch('tracks.json', {cache:'no-store'});
    if (r.ok) {
      const arr = await r.json();
      if (Array.isArray(arr) && arr.length) {
        tracks = arr;
        populateArtists();
        applyFilters();
        // try restore last index if present
        const saved = parseInt(localStorage.getItem('currentTrackIndex'));
        if (!isNaN(saved) && saved >=0 && saved < tracks.length) {
          currentTrackIndex = saved;
          const pos = filteredIndices.indexOf(currentTrackIndex);
          currentFilteredIndex = pos >= 0 ? pos : 0;
        }
        // do NOT autoplay
        loadTrackByFilteredIndex(currentFilteredIndex, false);
      }
    }
  } catch(e){
    // ignore: will load on user gesture
  }
})();

/* ---------------------------
   expose: loadTracksIfNeeded used by play button
   --------------------------- */
window.loadTracksIfNeeded = loadTracksIfNeeded;

</script>
</body>
</html>
