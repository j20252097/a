<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>ミュージックプレイヤー 🎧</title>
<style>
  /* --- 基本スタイル（前回のやわらかデザインを継承） --- */
  body {
    font-family: "Hiragino Sans", "Noto Sans JP", sans-serif;
    margin: 0;
    padding: 0;
    background: linear-gradient(135deg,#fcecff,#eafff8,#e0e8ff);
    min-height: 100vh;
    overflow-x: hidden;
    overflow-y: auto;
  }
  h1 { text-align:center; color:#6a5acd; padding-top:20px; }
  #player {
    max-width:800px;
    margin:18px auto 60px;
    background: rgba(255,255,255,0.95);
    border-radius:14px;
    padding:16px;
    box-shadow:0 6px 24px rgba(0,0,0,0.08);
    position:relative;
    z-index:2;
  }
  video{ width:100%; border-radius:10px; background:#000; display:block; }
  #info{ margin-top:10px; font-size:1.1rem; color:#444; text-align:center; }
  #controls,#extraControls{ display:flex; gap:10px; justify-content:center; margin-top:10px; flex-wrap:wrap;}
  button{
    background:#a58ff7; color:#fff; border:none; border-radius:8px; padding:8px 14px; cursor:pointer;
  }
  button.active{ background:#ff8cb0; }
  .sliderContainer{ width:100%; max-width:420px; margin:6px auto; text-align:left; }
  .sliderContainer label{ font-size:0.9rem; color:#444; display:block; margin-bottom:6px; }
  input[type="range"]{ width:100%; accent-color:#a58ff7; }

  /* progress */
  #progressContainer{ height:10px; background:#eee; border-radius:6px; margin-top:12px; cursor:pointer; position:relative; }
  #progressBar{ height:100%; width:0%; border-radius:6px; background:linear-gradient(90deg,#a58ff7,#ff8cb0); transition:width .06s linear; }

  #timeDisplay{ display:flex; justify-content:space-between; color:#666; font-size:0.9rem; margin-top:6px; }

  /* track list */
  #trackArea{ margin-top:10px; display:flex; gap:16px; align-items:flex-start; flex-wrap:wrap; }
  #trackList{ flex:1 1 320px; max-height:320px; overflow:auto; padding-right:6px; }
  .track{ background:#fff; padding:10px; border-radius:10px; margin-bottom:8px; box-shadow:0 2px 6px rgba(0,0,0,0.06); display:flex; justify-content:space-between; align-items:center; cursor:pointer;}
  .track.playing{ background:linear-gradient(90deg,#f0ebff,#fff); border-left:5px solid #a58ff7; }
  .fav{ font-size:1.2rem; color:#ccc; cursor:pointer; }
  .fav.active{ color:#ff6781; }

  /* EQ panel */
  #eqPanel{ flex:0 0 240px; background:rgba(255,255,255,0.9); border-radius:10px; padding:10px; box-shadow:0 2px 6px rgba(0,0,0,0.03); }
  #waveCanvas{ position:fixed; top:0; left:0; width:100vw; height:100vh; z-index:0; opacity:0.45; pointer-events:none; }

  footer{ text-align:center; color:#777; margin:26px 0; }
  @media(max-width:880px){ #trackArea{ flex-direction:column } #eqPanel{ order:2; width:100%; } }
</style>
</head>
<body>

<canvas id="waveCanvas"></canvas>

<h1>ミュージックプレイヤー 🎧</h1>

<div id="player">
  <!-- video要素。playsinlineを付けてモバイルでのインライン再生（バックグラウンド再生の可能性向上） -->
  <video id="mediaEl" controls playsinline webkit-playsinline crossorigin="anonymous"></video>

  <div id="info">曲名 ／ アーティスト</div>

  <div id="progressContainer"><div id="progressBar"></div></div>
  <div id="timeDisplay"><span id="curTime">0:00</span><span id="totTime">0:00</span></div>

  <div id="controls">
    <button id="prevBtn">⏮ 前へ</button>
    <button id="playBtn">▶️ / ⏸</button>
    <button id="nextBtn">⏭ 次へ</button>
  </div>

  <div id="extraControls">
    <button id="shuffleBtn">🔀 シャッフル</button>
    <button id="repeatBtn">🔁 リピート: オフ</button>
    <button id="favModeBtn">❤️ お気に入りのみ</button>
  </div>

  <div id="trackArea">
    <div id="trackList"></div>

    <div id="eqPanel">
      <h3 style="margin:0 0 8px 0;">EQ（5バンド）</h3>
      <!-- 各バンドのスライダー -->
      <div class="sliderContainer">
        <label>Low (〜150Hz) : <span id="band0Val">0 dB</span></label>
        <input type="range" id="band0" min="-12" max="12" step="0.5" />
      </div>
      <div class="sliderContainer">
        <label>Low-Mid (150–500Hz) : <span id="band1Val">0 dB</span></label>
        <input type="range" id="band1" min="-12" max="12" step="0.5" />
      </div>
      <div class="sliderContainer">
        <label>Mid (500–2kHz) : <span id="band2Val">0 dB</span></label>
        <input type="range" id="band2" min="-12" max="12" step="0.5" />
      </div>
      <div class="sliderContainer">
        <label>High-Mid (2k–6kHz) : <span id="band3Val">0 dB</span></label>
        <input type="range" id="band3" min="-12" max="12" step="0.5" />
      </div>
      <div class="sliderContainer">
        <label>High (6kHz〜) : <span id="band4Val">0 dB</span></label>
        <input type="range" id="band4" min="-12" max="12" step="0.5" />
      </div>
      <div style="text-align:center;margin-top:8px;">
        <button id="resetEQ">EQ リセット</button>
      </div>
    </div>
  </div>

  <!-- 検索 / フィルタ -->
  <div style="margin-top:12px;">
    <input id="searchBox" type="text" placeholder="🔍 曲名やアーティストで検索..." style="width:60%;max-width:360px;padding:8px;border-radius:8px;border:1px solid #ddd;">
    <select id="artistFilter" style="padding:8px;border-radius:8px;border:1px solid #ddd;">
      <option value="">すべてのアーティスト</option>
    </select>
  </div>
</div>

<footer>© 2025 MusicProject</footer>

<script>
/* =========================
   プレイヤー + EQ + 波形実装
   ========================= */

const mediaEl = document.getElementById('mediaEl');
const info = document.getElementById('info');
const progressBar = document.getElementById('progressBar');
const progressContainer = document.getElementById('progressContainer');
const curTime = document.getElementById('curTime');
const totTime = document.getElementById('totTime');

const playBtn = document.getElementById('playBtn');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const shuffleBtn = document.getElementById('shuffleBtn');
const repeatBtn = document.getElementById('repeatBtn');
const favModeBtn = document.getElementById('favModeBtn');

const trackListEl = document.getElementById('trackList');
const searchBox = document.getElementById('searchBox');
const artistFilter = document.getElementById('artistFilter');

let tracks = [];          // 外部 tracks.json から読み込み
let filtered = [];
let current = 0;
let favorites = JSON.parse(localStorage.getItem('favorites')||'[]');
let shuffle = JSON.parse(localStorage.getItem('shuffle')||'false');
let repeat = localStorage.getItem('repeat') || 'off';
let favMode = JSON.parse(localStorage.getItem('favMode')||'false');

let audioCtx = null;
let sourceNode = null;
let analyser = null;
let eqNodes = []; // 5 band
let frameCaptured = false; // サムネ取得フラグ

/* ========== 初期ロード ========== */
async function loadTracks() {
  const res = await fetch('tracks.json');
  tracks = await res.json();
  populateArtistFilter();
  applyFilters();
  loadTrack(0);
  updateUIButtons();
}
function populateArtistFilter(){
  const artists = [...new Set(tracks.map(t=>t.artist))].sort();
  for(const a of artists){
    const opt = document.createElement('option');
    opt.value = a; opt.textContent = a;
    artistFilter.appendChild(opt);
  }
}

/* ========== レンダー/操作 ========== */
function renderList(arr){
  filtered = arr;
  trackListEl.innerHTML = '';
  arr.forEach((t,i)=>{
    const div = document.createElement('div');
    div.className = 'track' + (i === current ? ' playing' : '');
    div.innerHTML = `<div style="flex:1;">${t.title} ／ ${t.artist}</div>
                     <div style="margin-left:8px;"><span class="fav ${favorites.includes(t.title)?'active':''}">❤</span></div>`;
    // クリック処理
    div.addEventListener('click',(e)=>{
      if(e.target.classList.contains('fav')){
        toggleFav(t.title, e.target);
        e.stopPropagation();
        return;
      }
      current = i;
      loadTrack(current);
      mediaEl.play();
    });
    trackListEl.appendChild(div);
  });
}

function toggleFav(title, el){
  if(favorites.includes(title)){ favorites = favorites.filter(x=>x!==title); el.classList.remove('active'); }
  else { favorites.push(title); el.classList.add('active'); }
  localStorage.setItem('favorites', JSON.stringify(favorites));
}

/* ========== ロード曲セット ========== */
function loadTrack(index){
  if(!filtered || filtered.length===0) return;
  index = Math.max(0, Math.min(filtered.length-1, index));
  current = index;
  const t = filtered[current];
  mediaEl.src = t.url;
  info.textContent = `${t.title} ／ ${t.artist}`;
  highlightPlaying();
  // リセットフレームキャプチャフラグ（再生開始後10秒でキャプチャ）
  frameCaptured = false;
  // Media Session metadata の初期セット（画像は後で差し替え）
  setMediaSessionMetadata(t.title, t.artist, null);
}

/* ハイライト更新 */
function highlightPlaying(){
  document.querySelectorAll('.track').forEach((el,i)=> el.classList.toggle('playing', i===current));
}

/* ========== フィルタ/検索 ========== */
searchBox.oninput = applyFilters;
artistFilter.onchange = applyFilters;
function applyFilters(){
  const kw = (searchBox.value || '').toLowerCase();
  const artist = artistFilter.value;
  let result = tracks.filter(t => (!artist || t.artist===artist) && (t.title.toLowerCase().includes(kw) || t.artist.toLowerCase().includes(kw)));
  if(favMode) result = result.filter(t=> favorites.includes(t.title));
  renderList(result);
}

/* ========== 再生制御 & UI更新 ========== */
playBtn.onclick = async ()=> {
  // AudioContextはユーザー操作で作る（ブラウザ制約回避）
  if(!audioCtx) await setupAudioGraph();
  if(mediaEl.paused) await mediaEl.play();
  else mediaEl.pause();
};
prevBtn.onclick = ()=> {
  current = (current - 1 + filtered.length) % filtered.length;
  loadTrack(current);
  mediaEl.play();
};
nextBtn.onclick = ()=> {
  if(shuffle) current = Math.floor(Math.random() * filtered.length);
  else current = (current+1)%filtered.length;
  loadTrack(current); mediaEl.play();
};
shuffleBtn.onclick = ()=> { shuffle=!shuffle; localStorage.setItem('shuffle', JSON.stringify(shuffle)); updateUIButtons(); };
repeatBtn.onclick = ()=> { repeat = (repeat==='off'?'one':(repeat==='one'?'all':'off')); localStorage.setItem('repeat', repeat); updateUIButtons(); };
favModeBtn.onclick = ()=> { favMode = !favMode; localStorage.setItem('favMode', JSON.stringify(favMode)); applyFilters(); updateUIButtons(); };

function updateUIButtons(){
  shuffleBtn.classList.toggle('active', shuffle);
  favModeBtn.classList.toggle('active', favMode);
  repeatBtn.textContent = repeat==='one' ? '🔂 リピート: 1曲' : repeat==='all' ? '🔁 リピート: 全体' : '🔁 リピート: オフ';
}

/* 自動次曲（終了時） */
mediaEl.onended = ()=>{
  if(repeat==='one'){ mediaEl.play(); return; }
  if(repeat==='all'){ nextBtn.onclick(); return; }
  // repeat off => 次の曲へ自動
  nextBtn.onclick();
};

/* progress */
mediaEl.ontimeupdate = ()=>{
  if(!mediaEl.duration || isNaN(mediaEl.duration)) return;
  const pct = (mediaEl.currentTime / mediaEl.duration) * 100;
  progressBar.style.width = pct + '%';
  curTime.textContent = formatTime(mediaEl.currentTime);
  totTime.textContent = formatTime(mediaEl.duration);
  // 10秒タイマーでサムネ取得
  if(!frameCaptured && mediaEl.currentTime >= 10){
    tryCaptureFrame();
    frameCaptured = true;
  }
};
progressContainer.onclick = (e)=>{
  const rect = progressContainer.getBoundingClientRect();
  const pos = (e.clientX - rect.left) / rect.width;
  if(mediaEl.duration) mediaEl.currentTime = pos * mediaEl.duration;
};
function formatTime(s){ if(!s || isNaN(s)) return '0:00'; const m=Math.floor(s/60); const sec=Math.floor(s%60); return `${m}:${String(sec).padStart(2,'0')}`; }

/* ========== Web Audio API 構築（EQ + Analyser） ========== */
async function setupAudioGraph(){
  // 既に作ってあれば何もしない
  if(audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  // media element source
  sourceNode = audioCtx.createMediaElementSource(mediaEl);

  // EQ バンド周波数（中心周波数を選定）
  const freqs = [100, 300, 1000, 3000, 8000]; // 5バンド（概ね低域→高域）
  eqNodes = freqs.map((f, idx)=>{
    const b = audioCtx.createBiquadFilter();
    if(idx===0){ b.type = 'lowshelf'; b.frequency.value = freqs[0]; }
    else if(idx===4){ b.type = 'highshelf'; b.frequency.value = freqs[4]; }
    else { b.type = 'peaking'; b.frequency.value = freqs[idx]; b.Q.value = 1.0; }
    b.gain.value = parseFloat(localStorage.getItem('eq_band_'+idx) || '0'); // 保存された値
    return b;
  });

  // analyser
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 2048;

  // 接続: source -> eq0 -> eq1 -> ... -> eq4 -> analyser -> destination
  let node = sourceNode;
  eqNodes.forEach(e=>{
    node.connect(e);
    node = e;
  });
  node.connect(analyser);
  analyser.connect(audioCtx.destination);

  // EQ UIとハンドラ初期化
  setupEQUI();
  // 波形描画を analyser に合わせて行う
  drawAudioWave();
  // MediaSession action handlers（AudioContext作成後だと安定）
  setupMediaSessionActions();
}

/* ========== EQ UI ========== */
function setupEQUI(){
  for(let i=0;i<5;i++){
    const slider = document.getElementById('band'+i);
    const label = document.getElementById('band'+i+'Val');
    // 既にlocalStorage値が入っているならセット
    const saved = localStorage.getItem('eq_band_'+i);
    const val = saved !== null ? Number(saved) : 0;
    slider.value = val;
    label.textContent = `${val} dB`;
    // イベント
    slider.oninput = ()=>{
      const v = parseFloat(slider.value);
      eqNodes[i].gain.value = v;
      label.textContent = `${v} dB`;
      localStorage.setItem('eq_band_'+i, v);
    };
  }
  document.getElementById('resetEQ').onclick = ()=>{
    for(let i=0;i<5;i++){ document.getElementById('band'+i).value = 0; eqNodes[i].gain.value = 0; document.getElementById('band'+i+'Val').textContent = '0 dB'; localStorage.removeItem('eq_band_'+i); }
  };
}

/* ========== 音連動波形描画（analyser） ========== */
function drawAudioWave(){
  const canvas = document.getElementById('waveCanvas');
  const ctx = canvas.getContext('2d');
  function resize(){ canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
  window.addEventListener('resize', resize); resize();

  const bufferLen = analyser.frequencyBinCount;
  const data = new Uint8Array(bufferLen);

  function draw(){
    requestAnimationFrame(draw);
    analyser.getByteTimeDomainData(data);
    ctx.clearRect(0,0,canvas.width,canvas.height);
    // 背景薄い線
    ctx.lineWidth = 2;
    for(let layer=0; layer<3; layer++){
      ctx.beginPath();
      const offsetY = canvas.height*0.5 + (layer-1)*40;
      for(let i=0;i<bufferLen;i++){
        const x = (i / bufferLen) * canvas.width;
        const v = data[i] / 128.0; // 0..2
        const y = offsetY + (v - 1) * 80 * (1/(layer+1));
        if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      }
      ctx.strokeStyle = `rgba(${120+layer*30},120,255,${0.08 + layer*0.08})`;
      ctx.stroke();
    }
  }
  draw();
}

/* ========== Media Session API（ロック画面表示等） ========== */
function setMediaSessionMetadata(title, artist, artworkUrl){
  if('mediaSession' in navigator){
    try{
      const metadata = new window.MediaMetadata({
        title: title || '',
        artist: artist || '',
        album: ''
      });
      if(artworkUrl){
        metadata.artwork = [{ src: artworkUrl, sizes: '512x512', type: 'image/png' }];
      }
      navigator.mediaSession.metadata = metadata;
      // playback state sync
      navigator.mediaSession.playbackState = mediaEl.paused ? 'paused' : 'playing';
    }catch(e){
      console.warn('MediaMetadata error', e);
    }
  }
}
function setupMediaSessionActions(){
  if(!('mediaSession' in navigator)) return;
  navigator.mediaSession.setActionHandler('play', ()=> mediaEl.play());
  navigator.mediaSession.setActionHandler('pause', ()=> mediaEl.pause());
  navigator.mediaSession.setActionHandler('previoustrack', ()=> { prevBtn.onclick(); });
  navigator.mediaSession.setActionHandler('nexttrack', ()=> { nextBtn.onclick(); });
  navigator.mediaSession.setActionHandler('seekto', (details)=> {
    if(details.seekTime !== undefined) mediaEl.currentTime = details.seekTime;
  });
}

/* ========== サムネ画像を 10秒時に取得してMedia Sessionにセット ========== */
async function tryCaptureFrame(){
  // 動的に canvas に現在の video フレームを描画 → dataURL 生成 → MediaMetadata artwork にセット
  try{
    // CORSによりセキュリティ制限あると失敗する（catchで握り潰す）
    const v = mediaEl;
    const c = document.createElement('canvas');
    c.width = v.videoWidth || 512;
    c.height = v.videoHeight || 512;
    const ctx = c.getContext('2d');
    ctx.drawImage(v, 0, 0, c.width, c.height);
    const dataUrl = c.toDataURL('image/png');
    // Object URL を作って使う（いくつかの実装は URL のほうが好まれる）
    const res = await fetch(dataUrl);
    const blob = await res.blob();
    const urlObj = URL.createObjectURL(blob);
    // set as Media Session artwork
    const cur = filtered[current];
    setMediaSessionMetadata(cur.title, cur.artist, urlObj);
    // 余裕があれば DOM にも表示（省略可）
  }catch(e){
    console.warn('frame capture failed (CORS?)', e);
  }
}

/* ========== MediaSession 再生状態同期 ========== */
mediaEl.onplay = ()=> { if('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing'; playBtn.textContent = '⏸ / ▶️'; };
mediaEl.onpause = ()=> { if('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused'; playBtn.textContent = '▶️ / ⏸'; };
mediaEl.onwaiting = ()=> { /* buffering */ };

/* ========== 初期化 ========== */
loadTracks();

/* ========== 検索/フィルタの初期表示 ========== */
document.addEventListener('DOMContentLoaded', ()=> {
  // ローカルに保存された再生モード・設定反映
  shuffle = JSON.parse(localStorage.getItem('shuffle')||'false');
  favMode = JSON.parse(localStorage.getItem('favMode')||'false');
  repeat = localStorage.getItem('repeat') || 'off';
  updateUIButtons();
});
</script>

</body>
</html>
